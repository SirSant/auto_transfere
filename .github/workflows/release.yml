name: Build and publish AutoTransfere

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install and bundle Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $sourceDir = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (!(Test-Path (Join-Path $sourceDir 'tesseract.exe'))) { throw "Tesseract installation not found at $sourceDir" }
          New-Item -ItemType Directory -Force runtime/tesseract | Out-Null
          Copy-Item -Path (Join-Path $sourceDir '*') -Destination runtime/tesseract -Recurse -Force
          $tessdataDir = Join-Path (Get-Location) 'runtime/tesseract/tessdata'
          New-Item -ItemType Directory -Force $tessdataDir | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/por.traineddata' -OutFile (Join-Path $tessdataDir 'por.traineddata')
          if (!(Test-Path (Join-Path $tessdataDir 'por.traineddata'))) {
            throw 'Portuguese OCR language data was not downloaded.'
          }

      - name: Apply version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content auto_transfere.py -Raw) -replace 'VERSAO_ATUAL = ".*"', "VERSAO_ATUAL = `"$version`"" | Set-Content auto_transfere.py -Encoding utf8
          (Get-Content installer.iss -Raw) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer.iss -Encoding utf8

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name AutoTransfere `
            --collect-all pyautogui `
            --collect-all keyboard `
            --collect-all pytesseract `
            --collect-all PIL `
            --hidden-import openpyxl `
            --add-data "runtime/tesseract;tesseract" `
            auto_transfere.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed.' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          if (!(Test-Path 'Output/AutoTransfere_Setup.exe')) { throw 'Installer file was not generated.' }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: Output/AutoTransfere_Setup.exe
          generate_release_notes: true
