name: Build and publish AutoTransfere

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $sourceDir = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (!(Test-Path (Join-Path $sourceDir 'tesseract.exe'))) {
            throw "Tesseract was not installed at $sourceDir"
          }
          New-Item -ItemType Directory -Force runtime/tesseract | Out-Null
          Copy-Item "$sourceDir\*" runtime/tesseract -Recurse -Force
          New-Item -ItemType Directory -Force runtime/tesseract/tessdata | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata' -OutFile 'runtime/tesseract/tessdata/por.traineddata'

      - name: Apply version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content auto_transfere.py -Raw) -replace 'VERSAO_ATUAL = ".*"', "VERSAO_ATUAL = `"$version`"" | Set-Content auto_transfere.py -Encoding utf8
          (Get-Content installer.iss -Raw) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer.iss -Encoding utf8

      - name: Build application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name AutoTransfere
          --collect-all pyautogui
          --collect-all keyboard
          --collect-all pytesseract
          --collect-all PIL
          --add-data "runtime/tesseract;tesseract"
          auto_transfere.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/AutoTransfere_Setup.exe
          generate_release_notes: true
